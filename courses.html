<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book a Course · IASE</title>
  <meta name="description" content="Book an IASE surf certification course at surf spots worldwide.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="courses">
  <header class="site-header" id="site-header"></header>

  <main>
    <div class="hero page-hero">
      <div class="container">
        <h1>Book a surf certification course</h1>
        <p>Choose your course, pick a surf spot anywhere in the world, and request your place. We confirm within 48 hours.</p>
      </div>
    </div>

    <section>
      <div class="container">
        <form id="booking-form" novalidate>
          <h2 class="step-title"><span>1</span> Choose a course</h2>
          <div class="grid" id="course-list"></div>

          <div class="form-card" style="margin-top:32px">
            <h2 class="step-title" style="margin-top:0"><span>2</span> Location &amp; date</h2>
            <div class="form-grid">
              <div class="field">
                <label for="spot">Surf spot</label>
                <select id="spot" name="spot" required></select>
                <span class="hint" id="spot-info"></span>
              </div>
              <div class="field">
                <label for="session">Start date</label>
                <select id="session" name="session" required></select>
              </div>
              <div class="field">
                <label for="participants">Participants</label>
                <input id="participants" name="participants" type="number" min="1" max="12" value="1" required>
              </div>
            </div>

            <h2 class="step-title"><span>3</span> Your details</h2>
            <div class="form-grid">
              <div class="field"><label for="name">Full name</label><input id="name" name="name" autocomplete="name" required></div>
              <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
              <div class="field"><label for="phone">Phone / WhatsApp</label><input id="phone" name="phone" type="tel" autocomplete="tel"></div>
              <div class="field"><label for="country">Country of residence</label><input id="country" name="country" autocomplete="country-name" required></div>
              <div class="field full"><label for="experience">Surfing &amp; teaching experience</label><textarea id="experience" name="experience" placeholder="e.g. surfing 5 years, hold lifeguard certificate, taught at a surf camp…"></textarea></div>
              <label class="check field full"><input type="checkbox" name="agree" value="yes" required> I understand this is a booking request; my place is confirmed once IASE replies and payment is arranged.</label>
            </div>

            <div class="summary">
              <div id="summary-text"></div>
              <div class="price" id="summary-total"></div>
            </div>
            <div class="btn-row"><button class="btn btn-primary" type="submit">Request booking</button></div>
            <div class="form-result" id="form-result" aria-live="polite"></div>
          </div>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
  <script src="js/config.js"></script>
  <script src="data/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
