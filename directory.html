<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Instructors &amp; Shops · IASE</title>
  <meta name="description" content="Find IASE certified surf instructors and partner surf shops around the world.">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="directory">
  <header class="site-header" id="site-header"></header>

  <main>
    <div class="hero page-hero">
      <div class="container">
        <h1>IASE instructors &amp; surf shops worldwide</h1>
        <p>Every listing is an IASE certified instructor or an approved partner shop. <span style="color:#7fc4e3">●</span> Instructors &nbsp; <span style="color:#f08a6c">●</span> Shops</p>
      </div>
    </div>

    <section>
      <div class="container">
        <div id="map" aria-label="Map of IASE instructors and shops"></div>
        <div class="filters">
          <input id="f-search" type="search" placeholder="Search name, town, certification, language…" aria-label="Search">
          <select id="f-type" aria-label="Type">
            <option value="">Instructors &amp; shops</option>
            <option value="instructor">Instructors only</option>
            <option value="shop">Shops only</option>
          </select>
          <select id="f-country" aria-label="Country"></select>
        </div>
        <div class="result-count" id="result-count"></div>
        <div class="grid" id="directory-list"></div>
        <p class="hint" style="margin-top:28px">Are you an IASE member who isn't listed? <a href="join.html">Apply to be added</a>.</p>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/config.js"></script>
  <script src="data/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
